version: 2
updates:
  # The workflow pins its actions to a major tag (for example actions/checkout@v7),
  # so the runner image and the action versions do not drift without a commit.
  # Patch and minor updates arrive bundled; majors arrive individually, because
  # they need a look at the changelog and a decision.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'ci'
    groups:
      github-actions-minor:
        patterns: ['*']
        update-types: ['minor', 'patch']

  # Only devDependencies exist (eslint, prettier). The lockfile must stay in the
  # diff: `npm ci` in the fast gate fails when package.json and package-lock.json
  # disagree, so excluding the lockfile produced pulls that could never pass
  # (observed on the first real update, eslint 10).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: 'chore'
    groups:
      dev-dependencies:
        patterns: ['*']
        update-types: ['minor', 'patch']
