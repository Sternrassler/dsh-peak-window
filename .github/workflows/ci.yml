name: NFR gates

# Gate model per docs/specs/nfr/02-quality-gates.md:
#   Fast / pre-merge  -> fast feedback; hard failures (secrets) block
#   Merge gate        -> binding quality threshold, blocks the merge
#   Release gate      -> release-relevant checks, blocks delivery
#
# The release gate lives in `publish.yml`, together with the publish itself: it
# runs the same checks and then releases through the protected `release`
# environment. Keeping a second release job here would only duplicate the checks
# on the same tag push.
#
# Escape marking (only individually listed findings, never whole gates):
#   Secret scan  -> entry in .gitleaksignore referencing the exception
#   SAST         -> `# nosemgrep` referencing the exception in the code
#   Dependencies -> documented exception in docs/nfr/ausnahmen/, the check stays
#                   blocking otherwise
#   Every exception is time-boxed (review date) and findable in the repo.
#
# Runner: pinned to `ubuntu-26.04`, not `ubuntu-latest`. The label migrates from
# 24.04 to 26.04 between 2026-10-19 and 2026-11-19, so an unpinned label would
# switch the checking environment on its own, possibly mid-release. The explicit
# version keeps the environment reproducible and turns a bump into a reviewable
# change. Checked before switching: semgrep 1.180.0 ships manylinux_2_34 wheels
# for cp314 and has tested against Python 3.14 since 1.140.0 (semgrep#11250,
# closed) — Python 3.14 is the default on 26.04. Node comes from the pinned
# setup-node action and gitleaks from a static linux_x64 release binary, so
# neither depends on the image's default interpreters.

on:
  pull_request:
  push:
    branches: [main]
    # Tags are listed explicitly: a `branches` filter alone means tag pushes do
    # not start this workflow at all, which made the release gate unreachable
    # rather than merely unenforced (observed: a pushed v-tag produced no run).
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fast:
    name: Fast / pre-merge
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Artifact freshness (client.js)
        run: npm run check:client
      - name: Lint (0 errors)
        run: npm run lint
      - name: Format (0 deviations)
        run: npm run format:check
      - name: Unit tests (time logic)
        run: npm test
      - name: Secret scan (gitleaks CLI, hard, blocking)
        run: |
          set -euo pipefail
          GITLEAKS_VERSION=8.30.1
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks detect --no-banner --redact --exit-code 1 --gitleaks-ignore-path .gitleaksignore

  merge:
    name: Merge gate
    needs: fast
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: SAST (Semgrep CLI, 0 critical/high)
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --disable-pip-version-check semgrep==1.180.0
          semgrep scan --config p/ci --error --severity ERROR --quiet
      - name: Dependency scan of production dependencies (0 exploitable critical/high)
        run: npm run deps
      - name: Unit tests
        run: npm test
      - name: Relative links and anchors
        run: npm run check:links
      - name: Definition of Done reminder
        run: echo "DoD and evidence (docs/nfr/nachweise/) remain a manual check."
