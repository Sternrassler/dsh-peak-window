name: NFR gates

# Gate model per docs/specs/nfr/02-quality-gates.md:
#   Fast / pre-merge  -> fast feedback; hard failures (secrets) block
#   Merge gate        -> binding quality threshold, blocks the merge
#   Release gate      -> release-relevant checks, blocks delivery
#
# Escape marking (only individually listed findings, never whole gates):
#   Secret scan  -> entry in .gitleaksignore referencing the exception
#   SAST         -> `# nosemgrep` referencing the exception in the code
#   Dependencies -> documented exception in docs/nfr/ausnahmen/, the check stays
#                   blocking otherwise
#   Every exception is time-boxed (review date) and findable in the repo.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fast:
    name: Fast / pre-merge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Artifact freshness (client.js)
        run: npm run check:client
      - name: Lint (0 errors)
        run: npm run lint
      - name: Format (0 deviations)
        run: npm run format:check
      - name: Unit tests (time logic)
        run: npm test
      - name: Secret scan (gitleaks CLI, hard, blocking)
        run: |
          set -euo pipefail
          GITLEAKS_VERSION=8.30.1
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks detect --no-banner --redact --exit-code 1 --gitleaks-ignore-path .gitleaksignore

  merge:
    name: Merge gate
    needs: fast
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: SAST (Semgrep CLI, 0 critical/high)
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --disable-pip-version-check semgrep==1.180.0
          semgrep scan --config p/ci --error --severity ERROR --quiet
      - name: Dependency scan of production dependencies (0 exploitable critical/high)
        run: npm run deps
      - name: Unit tests
        run: npm test
      - name: Relative links and anchors
        run: npm run check:links
      - name: Definition of Done reminder
        run: echo "DoD and evidence (docs/nfr/nachweise/) remain a manual check."

  release:
    name: Release gate
    needs: merge
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Full check
        run: npm run check
      - name: Release checklist (manual, in the 'release' environment)
        run: |
          echo "The release gate requires manual confirmation in the 'release' environment:"
          echo "- plugin_manager install_bundle -> application: applied"
          echo "- cordis_inspect_query Slots.listSubTree (root: conversation.composer.dock) shows the entry"
          echo "- visual check PEAK/OFF_PEAK + countdown in light and dark, no console errors"
