name: NFR-Gates

# Gate-Modell nach docs/specs/nfr/02-quality-gates.md:
#   Fast / Pre-Merge  -> schnelles Feedback; harte Fehler (Secrets) blockieren
#   Merge-Gate        -> verbindliche Qualitätsschwelle, blockiert den Merge
#   Release-Gate      -> auslieferungsrelevante Prüfungen, blockiert die Auslieferung
#
# Escape-Markierung (nur einzeln gelistete Befunde, nie ganze Gates):
#   Secret-Scan  -> Eintrag in .gitleaksignore mit Verweis auf die Ausnahme
#   SAST         -> `# nosemgrep` mit Verweis auf die Ausnahme im Code
#   Dependencies -> dokumentierte Ausnahme in docs/nfr/ausnahmen/, Prüfung bleibt
#                   sonst blockierend
#   Jede Ausnahme ist befristet (Review-Datum) und im Repo auffindbar.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fast:
    name: Fast / Pre-Merge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Artefakt-Aktualität (client.js)
        run: npm run check:client
      - name: Lint (0 Fehler)
        run: npm run lint
      - name: Format (0 Abweichungen)
        run: npm run format:check
      - name: Unit-Tests (Zeitlogik)
        run: npm test
      - name: Secret-Scan (gitleaks CLI, hart, blockierend)
        run: |
          set -euo pipefail
          GITLEAKS_VERSION=8.30.1
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks detect --no-banner --redact --exit-code 1 --gitleaks-ignore-path .gitleaksignore

  merge:
    name: Merge-Gate
    needs: fast
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: SAST (Semgrep CLI, 0 Critical/High)
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --disable-pip-version-check semgrep==1.180.0
          semgrep scan --config p/ci --error --severity ERROR --quiet
      - name: Abhängigkeits-Scan Produktivabhängigkeiten (0 ausnutzbare Critical/High)
        run: npm run deps
      - name: Unit-Tests
        run: npm test
      - name: Definition of Done Hinweis
        run: echo "DoD und Nachweise (docs/nfr/nachweise/) bleiben manuell zu prüfen."

  release:
    name: Release-Gate
    needs: merge
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Vollständige Prüfung
        run: npm run check
      - name: Release-Checkliste (manuell im Environment 'release')
        run: |
          echo "Release-Gate erfordert die manuelle Bestätigung im Environment 'release':"
          echo "- plugin_manager install_bundle -> application: applied"
          echo "- cordis_inspect_query Slots.listSubTree (root: conversation.composer.dock) zeigt den Eintrag"
          echo "- Sichtprüfung PEAK/OFF_PEAK + Countdown in Light und Dark, keine Console-Fehler"
