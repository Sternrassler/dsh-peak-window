name: Publish

# Publishes to npm via trusted publishing (OIDC): no token is stored anywhere.
# Triggered by a version tag, and gated by the protected `release` environment,
# so a human confirms before the package reaches the registry.
#
# Requirements checked against the npm documentation (docs.npmjs.com/trusted-publishers):
#   npm CLI >= 11.5.1 and Node >= 22.14.0, GitHub-hosted runner.
# The trusted publisher must be configured for this package on npmjs.com with
# exactly this workflow filename — otherwise the publish is refused.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Run the full check and package, but skip publishing'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-26.04
    environment: release
    permissions:
      contents: read
      # Required for OIDC: npm exchanges this identity for a short-lived token.
      id-token: write
    steps:
      - uses: actions/checkout@v7
      # No `cache: npm`: the setup-node cache keys on the npm version, and npm is
      # replaced below, which made runs fail before any step of interest.
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      # Trusted publishing needs npm >= 11.5.1, and no Node 22 release ships it:
      # 22.23.3 carries npm 10.9.9 (measured). Installing npm explicitly keeps the
      # toolchain reproducible and keeps `engines: node >= 20` honest — npm 12
      # would require node ^22.22.2, npm 11 only requires ^20.17.0 || >=22.9.0.
      - name: Install the npm version trusted publishing needs
        run: npm install --global npm@11.19.0
      - name: npm CLI version check (trusted publishing needs >= 11.5.1)
        run: |
          set -euo pipefail
          current=$(npm --version)
          echo "npm ${current}"
          node -e '
            const current = process.argv[1];
            const [maj, min] = current.split(".").map(Number);
            if (maj < 11 || (maj === 11 && min < 5)) {
              console.error("npm " + current + " is too old for trusted publishing");
              process.exit(1);
            }
          ' "${current}"
      - run: npm ci
      - name: Full check
        run: npm run check
      - name: Link check
        run: npm run check:links
      - name: Package contents
        run: npm pack --dry-run
      - name: Dry run only?
        if: ${{ inputs.dry-run == true }}
        run: |
          echo "workflow_dispatch with dry-run=true: the package was built and checked,"
          echo "nothing was published. Push a v* tag to publish for real."
      - name: Publish
        if: ${{ github.event_name == 'push' || inputs.dry-run == false }}
        run: npm publish
      - name: Verify the published version is retrievable
        if: ${{ github.event_name == 'push' || inputs.dry-run == false }}
        run: |
          set -euo pipefail
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          encoded=${name/\//%2F}
          attestation="https://registry.npmjs.org/-/npm/v1/attestations/$encoded@$version"

          # The registry replicates, so a fresh version is not visible everywhere
          # at once. The publish creates an attestation, which sits behind a
          # different endpoint: in the first real release `npm view` still needed
          # longer than a minute while the attestation was already reachable. Both
          # are therefore accepted as proof, which is what it is about — that the
          # publish actually landed. Waiting up to about three minutes.
          for attempt in $(seq 1 12); do
            published=$(npm view "$name@$version" version 2>/dev/null || true)
            if [ "$published" = "$version" ]; then
              echo "$name@$version is retrievable via the registry"
              exit 0
            fi
            status=$(curl -sS -o /dev/null -w '%{http_code}' "$attestation" 2>/dev/null || echo 000)
            if [ "$status" = "200" ]; then
              echo "$name@$version is published: the provenance attestation is retrievable"
              echo "note: the version listing had not caught up after ${attempt} attempt(s)"
              exit 0
            fi
            echo "attempt $attempt: neither the version listing nor the attestation is visible yet"
            sleep 15
          done
          echo "::error::$name@$version was not confirmed within about three minutes"
          exit 1
